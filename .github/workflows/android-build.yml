name: Android Build Pipeline

on:
  push:
    branches: [ "main", "Base" ] # Triggers only for the branch receiving commits
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out the source code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK) 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make Gradle script executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK File
      run: |
        if [ "${{ github.ref_name }}" = "Base" ]; then
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-Base-debug.apk
          echo "APK_PATH=app/build/outputs/apk/debug/app-Base-debug.apk" >> $GITHUB_ENV
          echo "APK_NAME=app-Base-debug.apk" >> $GITHUB_ENV
        else
          echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          echo "APK_NAME=app-debug.apk" >> $GITHUB_ENV
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APK_NAME }}
        path: ${{ env.APK_PATH }}

    - name: Create and Upload GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-${{ github.ref_name }}
        name: Build v${{ github.run_number }} (${{ github.ref_name }})
        draft: false
        prerelease: false
        files: ${{ env.APK_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
